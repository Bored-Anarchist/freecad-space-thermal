name: Publication checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy:
    name: Publication privacy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Test adversarial privacy and coverage cases
        env:
          PYTHONPATH: python
        run: python -S tools/check_security.py
      - name: Inspect complete outgoing history and metadata
        run: python tools/publication_preflight.py --revision HEAD
