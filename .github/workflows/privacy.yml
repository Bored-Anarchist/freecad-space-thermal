name: Publication checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  privacy:
    name: Publication privacy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-privacy-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock
      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Test adversarial privacy and coverage cases
        env:
          PYTHONPATH: python
        run: python tools/check_security.py --scope security
      - name: Inspect complete outgoing history and metadata
        run: python -S tools/publication_preflight.py --revision HEAD
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-privacy-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
