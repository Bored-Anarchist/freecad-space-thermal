name: Foundation CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-debug
          - os: windows-2022
            preset: windows-release
          - os: ubuntu-24.04
            preset: linux-debug
          - os: ubuntu-24.04
            preset: linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Install locked standalone tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Execute identical local driver
        run: python tools/verify.py --preset ${{ matrix.preset }}
      - name: Clear exact public reports
        if: always()
        run: python tools/publication_preflight.py --file .local/${{ matrix.preset }}/verification.json --file .local/${{ matrix.preset }}/build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ matrix.preset }}
          path: |
            .local/${{ matrix.preset }}/verification.json
            .local/${{ matrix.preset }}/build-info.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  gate:
    name: Foundation gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [build]
    steps:
      - name: Require every matrix configuration to pass
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
