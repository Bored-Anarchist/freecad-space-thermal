name: Foundation CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-debug
          - os: windows-2022
            preset: windows-release
          - os: ubuntu-24.04
            preset: linux-debug
          - os: ubuntu-24.04
            preset: linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Install locked standalone tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Execute identical local driver
        run: python tools/verify.py --preset ${{ matrix.preset }}
      - name: Clear exact public reports
        id: clear
        if: always()
        run: python tools/publication_preflight.py --file .local/${{ matrix.preset }}/verification.json --file .local/${{ matrix.preset }}/build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.clear.outcome == 'success'
        with:
          name: foundation-${{ matrix.preset }}
          path: |
            .local/${{ matrix.preset }}/verification.json
            .local/${{ matrix.preset }}/build-info.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  host:
    name: Host smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install locked tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Exact host document and geometry smoke
        run: python tools/host_smoke.py
      - name: Clear exact host report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/host/*/host-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: host-${{ matrix.os }}
          path: .local/host/*/host-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  dependencies:
    name: Package probe (${{ matrix.os }}, ${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        candidate: [sundials, hdf5, embree, occt, petsc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install locked tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Build install and run installed consumer
        run: python tools/build_dependencies.py --candidate ${{ matrix.candidate }} --jobs 2 --prepare-system
      - name: Clear exact package report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: package-${{ matrix.os }}-${{ matrix.candidate }}
          path: .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  gate:
    name: Foundation gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [build, host, dependencies]
    steps:
      - name: Require every matrix configuration to pass
        env:
          RESULT: ${{ needs.build.result }}
          HOST: ${{ needs.host.result }}
          PACKAGES: ${{ needs.dependencies.result }}
        run: test "$RESULT" = success && test "$HOST" = success && test "$PACKAGES" = success
