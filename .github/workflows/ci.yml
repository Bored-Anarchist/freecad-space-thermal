name: Foundation CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_workers:
        description: Run a calibrated paired Debug worker comparison on one runner
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-unit-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock --lock ci/mcp-requirements.lock
      - name: Install locked unit tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock -r ci/mcp-requirements.lock
      - name: Execute configuration-independent unit suite once
        run: python tools/check_security.py --report .local/unit/unit-tests.json
      - name: Clear exact unit receipt
        run: python tools/publication_preflight.py --file .local/unit/unit-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-units
          path: .local/unit/unit-tests.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock --lock ci/mcp-requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-unit-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
  build:
    needs: unit
    timeout-minutes: 60
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-debug
            acceptance_jobs: 4
          - os: windows-2022
            preset: windows-release
            acceptance_jobs: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-build-${{ matrix.preset }}-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock --lock ci/mcp-requirements.lock
      - name: Install locked standalone tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock -r ci/mcp-requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: foundation-units
          path: .local/unit-owner
      - name: Execute identical local driver
        env:
          FCST_DOWNLOAD_CACHE_STATE: ${{ steps.downloads.outputs.cache-hit == 'true' && 'warm' || 'cold' }}
        run: >-
          python tools/verify.py --preset ${{ matrix.preset }} --jobs ${{ matrix.acceptance_jobs }} --unit-report .local/unit-owner/unit-tests.json
          ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_workers && matrix.preset == 'windows-debug' && '--paired-workers' || '' }}
      - name: Clear exact public reports
        id: clear
        if: always()
        run: python tools/publication_preflight.py --file .local/${{ matrix.preset }}/verification.json --file .local/${{ matrix.preset }}/build-info.json --file .local/${{ matrix.preset }}/contracts.json --file .local/${{ matrix.preset }}/numerical.json --file .local/${{ matrix.preset }}/persistence.json --file .local/${{ matrix.preset }}/spatial.json --file .local/${{ matrix.preset }}/jobs.json --file .local/${{ matrix.preset }}/exchange.json --file .local/${{ matrix.preset }}/td.json --file .local/${{ matrix.preset }}/esatan.json --file .local/${{ matrix.preset }}/thermal.json --file .local/${{ matrix.preset }}/thermal-references.json --file .local/${{ matrix.preset }}/radiation.json --file .local/${{ matrix.preset }}/host.json --file .local/${{ matrix.preset }}/mcp.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.clear.outcome == 'success'
        with:
          name: foundation-${{ matrix.preset }}
          path: |
            .local/${{ matrix.preset }}/verification.json
            .local/${{ matrix.preset }}/build-info.json
            .local/${{ matrix.preset }}/contracts.json
            .local/${{ matrix.preset }}/numerical.json
            .local/${{ matrix.preset }}/persistence.json
            .local/${{ matrix.preset }}/spatial.json
            .local/${{ matrix.preset }}/jobs.json
            .local/${{ matrix.preset }}/exchange.json
            .local/${{ matrix.preset }}/td.json
            .local/${{ matrix.preset }}/esatan.json
            .local/${{ matrix.preset }}/thermal.json
            .local/${{ matrix.preset }}/thermal-references.json
            .local/${{ matrix.preset }}/radiation.json
            .local/${{ matrix.preset }}/host.json
            .local/${{ matrix.preset }}/mcp.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear paired worker evidence
        id: benchmark-clear
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_workers && matrix.preset == 'windows-debug'
        run: python tools/publication_preflight.py --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-0.json --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-1.json --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-2.json --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-3.json --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-4.json --file .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.event_name == 'workflow_dispatch' && inputs.benchmark_workers && matrix.preset == 'windows-debug' && steps.benchmark-clear.outcome == 'success'
        with:
          name: worker-benchmark
          path: |
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-0.json
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-1.json
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-2.json
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-3.json
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/attempt-4.json
            .local/worker-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock --lock ci/mcp-requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-build-${{ matrix.preset }}-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
  host:
    name: Host smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-host-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock
      - name: Install locked tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Exact host document and geometry smoke
        run: python tools/host_smoke.py
      - name: Pinned FEM foundation probes
        run: python tools/fem_probe.py
      - name: Build candidate worker for early GUI feedback
        run: python tools/build_host_worker.py
      - name: Installed workbench and software-rendered GUI acceptance
        run: python tools/check_host.py --worker out/windows-release/Release/fcst-worker.exe --report .local/host/workbench-host.json
      - name: Clear exact host report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/host/*/host-smoke.json --file .local/fem-probe/fem-probe.json --file .local/host/workbench-host.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: host-${{ matrix.os }}
          path: |
            .local/host/*/host-smoke.json
            .local/fem-probe/fem-probe.json
            .local/host/workbench-host.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-host-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
  dependencies:
    name: Package probe (${{ matrix.os }}, ${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        candidate: [sundials, hdf5, embree, occt]
        include:
          - candidate: sundials
            compiler_jobs: 2
          - candidate: hdf5
            compiler_jobs: 2
          - candidate: embree
            compiler_jobs: 4
          - candidate: occt
            compiler_jobs: 4
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-dependencies-${{ matrix.candidate }}-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock
      - name: Install locked tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Build install and run installed consumer
        run: python tools/build_dependencies.py --candidate ${{ matrix.candidate }} --jobs 2 --compiler-jobs ${{ matrix.compiler_jobs }} --prepare-system
      - name: Clear exact package report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: package-${{ matrix.os }}-${{ matrix.candidate }}
          path: .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-dependencies-${{ matrix.candidate }}-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
  dwg:
    name: Independent DWG backend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: downloads
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-dwg-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
      - name: Verify public downloads and prepare locked wheels
        run: python tools/cache_downloads.py prepare --lock ci/requirements.lock
      - name: Install locked tooling
        run: >-
          python -m pip install --no-index --find-links .local/public-download-cache/wheels --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Build and test independent native backend
        run: python tools/build_independent_dwg.py --report .local/dwg-backend.json
      - name: Clear exact bounded backend report
        id: clear
        run: python tools/publication_preflight.py --file .local/dwg-backend.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.clear.outcome == 'success'
        with:
          name: foundation-dwg
          path: .local/dwg-backend.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact public download cache
        id: cache-clear
        run: python tools/cache_downloads.py seal --lock ci/requirements.lock
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: success() && steps.cache-clear.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .local/public-download-cache
          key: public-downloads-v1-${{ runner.os }}-dwg-${{ hashFiles('ci/*.lock', 'ci/probe-sources.json', 'ci/host-profile.json', 'ci/dwg-backend.json', 'ci/pycanha-reference-runtime.json', 'ci/publication-policy.json', 'tools/cache_downloads.py') }}
  gate:
    name: Foundation gate
    runs-on: windows-2022
    if: always()
    needs: [build, host, dependencies, dwg]
    steps:
      - name: Require every matrix configuration to pass
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
          HOST: ${{ needs.host.result }}
          PACKAGES: ${{ needs.dependencies.result }}
          DWG: ${{ needs.dwg.result }}
        run: test "$RESULT" = success && test "$HOST" = success && test "$PACKAGES" = success && test "$DWG" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foundation-*
          path: .local/handoff-reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-windows-2022
          path: .local/handoff-reports/host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-*
          path: .local/handoff-reports/packages
      - name: Candidate-bound TST-022 handoff
        run: python tools/check_foundation_handoff.py --reports .local/handoff-reports --report .local/handoff.json
      - name: Compare verified CI timings with recorded baseline
        run: python tools/summarize_ci_performance.py --reports .local/handoff-reports --report .local/ci-performance.json
      - name: Clear final handoff report
        run: python tools/publication_preflight.py --file .local/handoff.json --file .local/ci-performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-handoff
          path: |
            .local/handoff.json
            .local/ci-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
