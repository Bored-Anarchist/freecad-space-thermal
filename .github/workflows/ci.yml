name: Foundation CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-debug
          - os: windows-2022
            preset: windows-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Install locked standalone tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Execute identical local driver
        run: python tools/verify.py --preset ${{ matrix.preset }}
      - name: Clear exact public reports
        id: clear
        if: always()
        run: python tools/publication_preflight.py --file .local/${{ matrix.preset }}/verification.json --file .local/${{ matrix.preset }}/build-info.json --file .local/${{ matrix.preset }}/contracts.json --file .local/${{ matrix.preset }}/numerical.json --file .local/${{ matrix.preset }}/persistence.json --file .local/${{ matrix.preset }}/spatial.json --file .local/${{ matrix.preset }}/jobs.json --file .local/${{ matrix.preset }}/exchange.json --file .local/${{ matrix.preset }}/td.json --file .local/${{ matrix.preset }}/esatan.json --file .local/${{ matrix.preset }}/thermal.json --file .local/${{ matrix.preset }}/thermal-references.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.clear.outcome == 'success'
        with:
          name: foundation-${{ matrix.preset }}
          path: |
            .local/${{ matrix.preset }}/verification.json
            .local/${{ matrix.preset }}/build-info.json
            .local/${{ matrix.preset }}/contracts.json
            .local/${{ matrix.preset }}/numerical.json
            .local/${{ matrix.preset }}/persistence.json
            .local/${{ matrix.preset }}/spatial.json
            .local/${{ matrix.preset }}/jobs.json
            .local/${{ matrix.preset }}/exchange.json
            .local/${{ matrix.preset }}/td.json
            .local/${{ matrix.preset }}/esatan.json
            .local/${{ matrix.preset }}/thermal.json
            .local/${{ matrix.preset }}/thermal-references.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  host:
    name: Host smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install locked tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Exact host document and geometry smoke
        run: python tools/host_smoke.py
      - name: Pinned FEM foundation probes
        run: python tools/fem_probe.py
      - name: Clear exact host report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/host/*/host-smoke.json --file .local/fem-probe/fem-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: host-${{ matrix.os }}
          path: |
            .local/host/*/host-smoke.json
            .local/fem-probe/fem-probe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  dependencies:
    name: Package probe (${{ matrix.os }}, ${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        candidate: [sundials, hdf5, embree, occt]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install locked tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Build install and run installed consumer
        run: python tools/build_dependencies.py --candidate ${{ matrix.candidate }} --jobs 2 --prepare-system
      - name: Clear exact package report
        id: clear
        if: always()
        shell: bash
        run: python tools/publication_preflight.py --file .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.clear.outcome == 'success'
        with:
          name: package-${{ matrix.os }}-${{ matrix.candidate }}
          path: .local/dependency-builds/*/dependency-builds-${{ matrix.candidate }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  dwg:
    name: Independent DWG backend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install locked tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Build and test independent native backend
        run: python tools/build_independent_dwg.py --report .local/dwg-backend.json
      - name: Clear exact bounded backend report
        id: clear
        run: python tools/publication_preflight.py --file .local/dwg-backend.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.clear.outcome == 'success'
        with:
          name: foundation-dwg
          path: .local/dwg-backend.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  gate:
    name: Foundation gate
    runs-on: windows-2022
    if: always()
    needs: [build, host, dependencies, dwg]
    steps:
      - name: Require every matrix configuration to pass
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
          HOST: ${{ needs.host.result }}
          PACKAGES: ${{ needs.dependencies.result }}
          DWG: ${{ needs.dwg.result }}
        run: test "$RESULT" = success && test "$HOST" = success && test "$PACKAGES" = success && test "$DWG" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foundation-*
          path: .local/handoff-reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-windows-2022
          path: .local/handoff-reports/host
      - name: Candidate-bound TST-022 handoff
        run: python tools/check_foundation_handoff.py --reports .local/handoff-reports --report .local/handoff.json
      - name: Clear final handoff report
        run: python tools/publication_preflight.py --file .local/handoff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-handoff
          path: .local/handoff.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
