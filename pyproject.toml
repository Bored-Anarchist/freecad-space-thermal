[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fcst"
version = "0.1.0"
description = "Independent spacecraft thermal engine application interfaces"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
arrays = ["h5py==3.12.1", "numpy==2.2.3"]
mcp = ["jsonschema==4.23.0", "h5py==3.12.1", "numpy==2.2.3"]

[project.scripts]
fcst = "fcst_cli.__main__:main"
fcst-mcp = "fcst_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
fcst_contracts = ["bundle.json"]
fcst_exchange = ["dwg-profile.json"]
fcst_host = ["templates.json"]
