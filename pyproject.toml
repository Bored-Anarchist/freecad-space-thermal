[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fcst"
version = "0.1.0"
description = "Independent spacecraft thermal engine application interfaces"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = []

[project.scripts]
fcst = "fcst_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
